name: "Security CI"

on:
  pull_request:
    branches: [ "main-new" ]
  schedule:
    - cron: "0 3 * * 1"  # optional: weekly scan (Mondays 03:00 UTC)

jobs:
  # ---------------------------
  # 1) CodeQL static analysis
  # ---------------------------
  codeql:
    name: CodeQL Analysis (JS/TS)
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write  # needed to upload results to Security tab

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          # "javascript" covers both JavaScript and TypeScript
          languages: javascript
          # optional: uncomment for extra rules
          # queries: security-and-quality

      # For JS/TS apps, autobuild is usually enough.
      # If it fails, you can replace it with manual npm install/build.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

# ---------------------------------------------
  # 4) Maria - Spell Checker
  # ---------------------------------------------
  spell-check:
    name: Spell Checker (Maria)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Spell Checker
        uses: crate-ci/typos@v1.21.0
        with:
          config: .typos.toml   # optional config file

  # ---------------------------------------------
  # 5) Valentina - Broken Link Checker
  # ---------------------------------------------
  broken_links:
    name: Broken Link Detection (Valen)
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Run Broken Link Checker
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress ./client ./server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 
      - name: Upload broken links report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: broken-links-report
          path: ./lychee-report.md
  
  # ---------------------------------------------
  # 6)  Jenn - Image Optimization
  # ---------------------------------------------
  image-optimization:
    name: Image Optimization
    runs-on: ubuntu-latest
 
    permissions:
      contents: read
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Run Image Optimization Check
        uses: calibreapp/image-actions@v1
        with:
          image_paths: |
            **/*.png
            **/*.jpg
            **/*.jpeg
            **/*.webp
          compress_only: true
 
      - name: Validate Optimization State
        run: |
          if ! git diff --quiet; then
            echo "Image files were modified during optimization."
            echo "Please optimize images locally and commit the updated files."
            git diff --stat
            exit 1
          else
            echo "All images are optimized."

